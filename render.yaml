services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: smart-college-counselor-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && PYTHONPATH=.. python ../database/seed/seed_data.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./college_counselor.db

  # 2. Frontend Static Site (React + Vite)
  - type: web
    name: smart-college-counselor-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-college-counselor-backend
          property: host
